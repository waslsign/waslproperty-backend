services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wasl_property
    ports:
      - '5433:5432'
    volumes:
      - wasl_property_db_data:/var/lib/postgresql/data

volumes:
  wasl_property_db_data:
